<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VOCAB MASTER</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#f4f6fa;--card:#fff;--ink:#14213d;--mut:#6b7690;--blue:#1d4ed8;--green:#16a34a;--orange:#ea7a0c;--line:#e3e8f1}
@media(prefers-color-scheme:dark){:root{--bg:#0f1624;--card:#18223a;--ink:#eef2fb;--mut:#9aa7c2;--line:#2a3654}}
*{box-sizing:border-box}body{margin:0;font-family:Sarabun,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
nav{position:fixed;z-index:5;background:var(--card);border-right:1px solid var(--line);inset:0 auto 0 0;width:220px;padding:20px 12px}
nav h1{font-size:18px;margin:0 8px 2px;color:var(--blue)}nav small{display:block;margin:0 8px 18px;color:var(--mut);font-size:12px}
nav a{display:block;padding:10px 12px;border-radius:10px;color:var(--ink);cursor:pointer}
nav a.on{background:var(--blue);color:#fff}
main{margin-left:220px;padding:28px;max-width:980px}
.card{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 1px 4px #0001;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat b{font-size:28px;display:block}.stat span{color:var(--mut);font-size:13px}
button,select,input{font:inherit;border-radius:10px;border:1px solid var(--line);padding:9px 14px;background:var(--card);color:var(--ink)}
button{cursor:pointer}button.p{background:var(--blue);color:#fff;border-color:var(--blue)}
button.g{background:var(--green);color:#fff;border-color:var(--green)}button.o{background:var(--orange);color:#fff;border-color:var(--orange)}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
.scene{perspective:1200px;max-width:560px;margin:0 auto}
.flip{position:relative;height:520px;transition:transform .6s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border-radius:20px;padding:24px;box-shadow:0 4px 18px #0002;overflow:auto}
.back{transform:rotateY(180deg)}
.front{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.front h2{font-size:52px;margin:0}.tag{background:var(--bg);padding:3px 10px;border-radius:99px;font-size:13px;color:var(--mut)}
.pic{height:110px;display:grid;place-items:center;font-size:64px;background:var(--bg);border-radius:12px}
.back p{margin:6px 0}.th{color:var(--mut)}
.search{display:grid;gap:8px}.item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.warn{border-left:4px solid var(--orange)}
@media(max-width:760px){nav{inset:auto 0 0 0;width:auto;display:flex;padding:4px;border-right:0;border-top:1px solid var(--line)}
nav h1,nav small{display:none}nav a{flex:1;text-align:center;font-size:11px;padding:8px 2px}main{margin:0;padding:16px 14px 80px}.front h2{font-size:40px}.flip{height:560px}}
@media(prefers-reduced-motion:reduce){.flip{transition:none}}

.home{max-width:560px;margin:0 auto;text-align:center}
.hero{background:linear-gradient(135deg,#1d4ed8,#3b82f6 65%,#60a5fa);color:#fff;border-radius:24px;padding:32px 20px;box-shadow:0 10px 30px #1d4ed844}
.hero h1{margin:0;font-size:30px;letter-spacing:.5px}.hero p{opacity:.92;margin:6px 0 20px}
.big{display:block;width:100%;min-height:52px;padding:14px;font-size:18px;font-weight:700;border-radius:14px;border:0}
.hero .big{background:#fff;color:#1d4ed8}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 16px}
.pick button{padding:20px 10px;border-radius:18px;font-size:17px;font-weight:600;line-height:1.5;box-shadow:0 2px 8px #0001}.pick b{display:block;font-size:36px}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;margin:0 auto 8px;background:conic-gradient(var(--green) calc(var(--p)*1%),var(--line) 0)}
.ring span{background:var(--card);width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-weight:700}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick button{min-height:64px;padding:12px 6px}

.lib{max-width:640px;margin:0 auto}.lib h2{text-align:center}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.seg button{min-height:56px;font-size:17px;font-weight:700;border-radius:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{min-height:44px;border-radius:99px;padding:8px 14px}.chip small{opacity:.7}
.sum{margin-top:16px;text-align:center}.sum b{font-size:24px}
details summary{cursor:pointer;font-weight:600}
.startbar{position:sticky;bottom:12px;z-index:4;max-width:640px;margin:12px auto 0;display:flex;gap:12px;align-items:center;background:var(--card);padding:10px 12px;border-radius:18px;box-shadow:0 6px 24px #0003}
.startbar .big{flex:1;margin:0;background:var(--blue);color:#fff}.startbar button:disabled{opacity:.45}
@media(max-width:760px){.startbar{bottom:calc(64px + env(safe-area-inset-bottom,0px))}}

.fc{max-width:560px;margin:0 auto}
.fchead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.fchead button{min-width:48px;min-height:44px}
.flip{height:clamp(320px,calc(100dvh - 340px),540px)}
.fcbar{display:block;max-width:560px;padding:10px}
.kr{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fcbar .kr .big{margin:0;min-height:54px;color:#fff}
.fcbar .kr .o{background:var(--orange)}.fcbar .kr .g{background:var(--green)}
.nv{display:grid;grid-template-columns:1fr 2fr 1fr 1fr;gap:8px;margin-top:8px}.nv button{min-height:46px}
.pb{margin:8px 0}.grid .card{padding:12px;margin:0}.stat b{font-size:22px}.lib .grid{margin:12px 0}
.searchbar{position:sticky;top:0;z-index:3;background:var(--bg);padding:8px 0}.searchbar input{width:100%;font-size:17px;padding:12px}
.fl select{flex:1 1 45%;min-height:44px}.item{min-height:48px;align-items:center}

:root{padding-top:env(safe-area-inset-top,0px)}nav{padding-bottom:calc(4px + env(safe-area-inset-bottom,0px))}</style></head><body>
<nav id="nav"></nav><main id="app"></main>

const Progress={key:'vocabmaster.v1',d:null,
load(){try{this.d=JSON.parse(localStorage.getItem(this.key))}catch(e){}
 this.d=this.d||{cards:{},daily:{},settings:{accent:'US',goal:20,perRound:20}};return this.d},
save(){try{localStorage.setItem(this.key,JSON.stringify(this.d))}catch(e){}},
today(){return new Date().toISOString().slice(0,10)},
get(id){return this.d.cards[id]},
mark(id,known){const c=this.d.cards[id]||{box:0,seen:0};c.seen++;
 const t=this.today();this.d.daily[t]=(this.d.daily[t]||0)+1;
 Review.update(c,known);this.d.cards[id]=c;this.save()},
reset(){localStorage.removeItem(this.key);this.d=null;this.load()}};
Progress.load();

const Vocab={all:[],sets:{oxford:{file:'data/oxford3000.json'},toeic:{file:'data/toeic3000.json'}},meta:{},
LEVELS:[['A1','Beginner'],['A2','Elementary'],['B1','Intermediate'],['B2','Upper Intermediate'],['C1','Advanced'],['C2','Proficiency']],
async load(){const errs=[];
 for(const [k,s] of Object.entries(this.sets)){
  try{const j=window.__DATA[k];
   this.meta[k]=j.meta;j.words.forEach(w=>this.all.push({...w,set:k,id:w.id||k+':'+w.word+':'+w.pos}))}
  catch(e){errs.push(s.file)}}
 try{(JSON.parse(localStorage.getItem('vocabmaster.import'))||[]).forEach(w=>this.all.push(w))}catch(e){}
 return errs},
filter({set,level,cat,pos,q}={}){q=(q||'').toLowerCase();
 return this.all.filter(w=>(!set||w.set===set)&&(!level||w.level===level)&&(!cat||w.category===cat)&&(!pos||w.pos===pos)&&
  (!q||[w.word,w.th,w.pos,w.category].join(' ').toLowerCase().includes(q)))},
import(text){const j=JSON.parse(text);const ws=(j.words||j).map(w=>({...w,set:w.set||'oxford',id:'imp:'+w.word+':'+w.pos}));
 const old=JSON.parse(localStorage.getItem('vocabmaster.import')||'[]');
 localStorage.setItem('vocabmaster.import',JSON.stringify(old.concat(ws)));this.all.push(...ws);return ws.length}};

// Leitner spaced repetition: box 0..5 -> interval in days
const Review={days:[0,1,2,4,8,16],
update(c,known){c.box=known?Math.min(5,(c.box||0)+1):0;c.known=known;
 const due=new Date();due.setDate(due.getDate()+this.days[c.box]);c.due=due.toISOString().slice(0,10)},
isDue(c){return c&&c.due&&c.due<=Progress.today()},
dueWords(){return Vocab.all.filter(w=>this.isDue(Progress.get(w.id)))}};

const Gen={key:'vocabmaster.sent',cache:{},
load(){try{this.cache=JSON.parse(localStorage.getItem(this.key))||{}}catch(e){this.cache={}}},
save(){try{localStorage.setItem(this.key,JSON.stringify(this.cache))}catch(e){}},
async ai(){try{return window.claude?await claude.use('sample'):null}catch(e){return null}},
async batch(ws){const s=await this.ai();if(!s)throw{code:'na'};
 const r=await s.json('You write example sentences for a Thai learner vocabulary app. For EACH item write 3 natural, realistic English sentences that use the word in the sense of the given Thai meaning (pos may be empty). 8-16 words each, clear context, CEFR-appropriate; if cat is a TOEIC category use workplace/business contexts. Add an accurate, natural Thai translation for every sentence. Return ONLY a JSON array: [{"id":"..","s":[{"en":"..","th":".."}]}].\nItems: '+JSON.stringify(ws.map(w=>({id:w.id,word:w.word,pos:w.pos,th:w.th,cat:w.category||w.level}))));
 (Array.isArray(r)?r:[]).forEach(x=>{if(x&&x.id&&Array.isArray(x.s)){const a=x.s.filter(e=>e&&e.en&&e.th).slice(0,3);if(a.length)this.cache[x.id]=a}});this.save()},
err(e){const c=e&&e.code;alert(c==='na'?'ฟีเจอร์นี้ใช้ได้เมื่อเปิดจากลิงก์ที่เผยแพร่เท่านั้น':c==='not_granted'?'ยังไม่ได้อนุญาตให้ Claude สร้างประโยค':c==='rate_limited'?'ใช้บ่อยเกินไป ลองใหม่อีกครั้งภายหลัง':'สร้างประโยคไม่สำเร็จ ลองใหม่อีกครั้ง')},
html(w){const c=this.cache[w.id];
 if(c)return`<p><b>ประโยคใช้จริง</b> <span class="th">(แต่งโดย AI)</span></p>`+c.map((e,n)=>`<p>• ${e.en} <button onclick="Gen.say('${w.id}',${n})">🔊</button><br><span class="th">แปล: ${e.th}</span></p>`).join('');
 return`<button id="gbtn" onclick="Gen.one()">✨ แต่งประโยคใช้จริงเพิ่ม</button>`},
say(id,n){Flash.speak(this.cache[id][n].en)},
async one(){const w=Flash.deck[Flash.i],b=document.getElementById('gbtn');if(b){b.disabled=true;b.textContent='กำลังแต่งประโยค…'}
 try{await this.batch([w])}catch(e){this.err(e)}App.render()},
async deck(){const todo=Flash.deck.filter(w=>!this.cache[w.id]),st=document.getElementById('gst');
 if(!todo.length){st.textContent='ทุกคำในชุดนี้มีประโยคแล้ว';return}
 try{for(let i=0;i<todo.length;i+=8){st.textContent='กำลังสร้าง '+Math.min(i+8,todo.length)+'/'+todo.length+'…';await this.batch(todo.slice(i,i+8))}App.render()}catch(e){this.err(e);st.textContent=''}}};
Gen.load();
const Flash={deck:[],i:0,flipped:false,
start(words,n){let d=words.slice();if(n&&n<d.length)d=d.sort(()=>Math.random()-.5).slice(0,n);this.deck=d;this.i=0;this.flipped=false;this.done=false},
speak(t){if(!('speechSynthesis' in window))return alert('เบราว์เซอร์นี้ไม่รองรับเสียงอ่าน');
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=Progress.d.settings.accent==='UK'?'en-GB':'en-US';u.rate=.9;speechSynthesis.speak(u)},
html(){if(this.done)return`<div class="home"><div class="card"><div style="font-size:56px">🎉</div><h2>จบรอบแล้ว</h2><p class="th">เรียนครบ ${this.deck.length} คำ</p><button class="p big" onclick="Flash.shuffle()">🔀 เรียนซ้ำอีกรอบ</button><button class="big" style="margin-top:10px" onclick="App.go('library')">เลือกชุดอื่น</button></div></div>`;
 const w=this.deck[this.i];if(!w)return `<div class="home"><div class="card">ยังไม่ได้เลือกชุดคำศัพท์<button class="p big" style="margin-top:12px" onclick="App.go('library')">เลือกชุดคำศัพท์</button></div></div>`;
 const li=a=>(a||[]).join(', ');
 return `<div class="fc"><div class="fchead"><button onclick="App.go('library')" aria-label="กลับ">←</button><b>Card ${this.i+1} / ${this.deck.length}</b><button onclick="Gen.deck()" title="แต่งประโยคทั้งชุด">✨</button></div><div class="bar"><i style="width:${(this.i+1)/this.deck.length*100}%"></i></div><span id="gst" class="th"></span>
 <div class="scene" style="margin-top:14px"><div class="flip ${this.flipped?'on':''}" id="flip">
 <div class="face front"><span class="tag">${w.level||w.category}</span><h2>${w.word}</h2>${w.pos?`<span class="tag">${w.pos}</span>`:""}
 <button onclick="Flash.speak(Flash.deck[Flash.i].word)" aria-label="ฟังเสียง">🔊 ฟังเสียง</button><button class="p" onclick="Flash.flip()">Show Answer</button></div>
 <div class="face back"><div class="pic" title="รูปประกอบ (placeholder — ยังไม่ได้เชื่อม Image API)">${w.img||'🖼️'}</div>
 <h3>${w.word} <small>${w.ipa||''}</small> <button onclick="Flash.speak(Flash.deck[Flash.i].word)">🔊</button></h3>
 <p><b>${w.th}</b> ${w.pos?`<span class="tag">${w.pos}</span>`:""}</p>${w.reading?`<p class="th">คำอ่าน: ${w.reading}</p>`:''}${w.def?`<p>${w.def}</p>`:''}
 ${(w.examples||[]).map((e,n)=>`<p>• ${e.en} <button onclick="Flash.speak(Flash.deck[Flash.i].examples[${n}].en)">🔊</button><br><span class="th">แปล: ${e.th}</span></p>`).join('')}
 ${(w.syn||[]).length?`<p><b>Synonyms:</b> ${li(w.syn)}</p>`:''}${(w.col||[]).length?`<p><b>Collocations:</b> ${li(w.col)}</p>`:''}${((w.examples||[]).length||Gen.cache[w.id])?'':'<p class="th">ยังไม่มีประโยคตัวอย่างสำหรับคำนี้</p>'}${Gen.html(w)}</div></div></div><div class="startbar fcbar"><div class="kr"><button class="o big" onclick="Flash.mark(false)">↻ ทบทวน</button><button class="g big" onclick="Flash.mark(true)">✓ จำได้</button></div><div class="nv"><button onclick="Flash.go(-1)" aria-label="ก่อนหน้า">←</button><button onclick="Flash.flip()">พลิกการ์ด</button><button onclick="Flash.go(1)" aria-label="ถัดไป">→</button><button onclick="Flash.shuffle()" aria-label="สุ่ม">🔀</button></div></div></div>`},
flip(){this.flipped=!this.flipped;document.getElementById('flip').classList.toggle('on',this.flipped)},
go(d){this.i=Math.max(0,Math.min(this.deck.length-1,this.i+d));this.flipped=false;App.render()},
shuffle(){this.deck.sort(()=>Math.random()-.5);this.i=0;this.flipped=false;this.done=false;App.render()},
mark(k){Progress.mark(this.deck[this.i].id,k);if(this.i<this.deck.length-1)this.go(1);else{this.done=true;App.render()}}};

const App={view:'home',sel:{set:'oxford',level:''},err:[],sf:{q:'',set:'',level:'',pos:'',cat:''},
pages:[['home','🏠 Home'],['library','📚 Library'],['flashcard','🃏 Learn'],['review','🔁 Review'],['progress','📊 Progress'],['search','🔍 Search'],['settings','⚙️ Settings']],
async init(){this.err=await Vocab.load();this.render()},
go(v){this.view=v;this.render()},
nav(){document.getElementById('nav').innerHTML='<h1>VOCAB MASTER</h1><small>Build your vocabulary. Master your English.</small>'+
 this.pages.map(([k,l])=>`<a tabindex=0 class="${k===this.view?'on':''}" onclick="App.go('${k}')">${l}</a>`).join('')},
st(ws){const c=Progress.d.cards;let k=0,r=0,s=0;ws.forEach(w=>{const x=c[w.id];if(x){s++;x.known?k++:r++}});return{total:ws.length,seen:s,unseen:ws.length-s,known:k,review:r}},
stats(ws){const s=this.st(ws);return`<div class="grid">${[['total','ทั้งหมด'],['seen','เรียนแล้ว'],['unseen','ยังไม่เรียน'],['known','จำได้'],['review','ต้องทบทวน']].map(([k,l])=>`<div class="card stat"><b>${s[k]}</b><span>${l}</span></div>`).join('')}</div>`},
start(ws,n){Flash.start(ws,n);this.go('flashcard')},
startOne(id){this.start(Vocab.all.filter(w=>w.id===id))},
render(){this.nav();const a=document.getElementById('app');a.innerHTML=(this.err.length?`<div class="card warn">โหลดไฟล์ไม่ได้: ${this.err.join(', ')}<br>ให้เปิดผ่านเซิร์ฟเวอร์ เช่น <code>python3 -m http.server</code> แล้วเข้า localhost:8000 (เบราว์เซอร์บล็อก fetch จาก file://)</div>`:'')+(this['v_'+this.view]?this['v_'+this.view]():'')},
v_home(){const due=Review.dueWords().length,g=Progress.d.settings.goal,t=Progress.d.daily[Progress.today()]||0,p=Math.min(100,Math.round(t/g*100)),has=Flash.deck.length,nO=Vocab.filter({set:'oxford'}).length,nT=Vocab.filter({set:'toeic'}).length;
 return`<div class="home"><div class="hero"><h1>VOCAB MASTER</h1><p>Build your vocabulary. Master your English.</p>
 <button class="big" onclick="App.go('${has?'flashcard':'library'}')">${has?'▶ เรียนต่อจากเดิม':'▶ เริ่มเรียนเลย'}</button></div>
 <h3>เลือกคลังคำศัพท์</h3><div class="pick">
 <button onclick="App.sel={set:'oxford',level:'',cat:''};App.go('library')"><b>📘</b>Oxford 3000<br><small class="th">${nO} คำ · A1–B2</small></button>
 <button onclick="App.sel={set:'toeic',level:'',cat:''};App.go('library')"><b>💼</b>TOEIC<br><small class="th">${nT} คำ · 12 หมวด</small></button></div>
 <div class="card"><div class="ring" style="--p:${p}"><span>${t}/${g}</span></div>เป้าหมายวันนี้ (คำ)</div>
 <div class="card">${due?`มี <b>${due}</b> คำที่ถึงเวลาทบทวน<button class="o big" style="margin-top:10px" onclick="App.go('review')">🔁 ทบทวนเลย</button>`:'วันนี้ยังไม่มีคำที่ต้องทบทวน 🎉'}</div>
 <div class="quick"><button onclick="App.go('search')">🔍<br>ค้นหา</button><button onclick="App.go('progress')">📊<br>ความก้าวหน้า</button><button onclick="App.go('settings')">⚙️<br>ตั้งค่า</button></div></div>`},
v_library(){const s=this.sel,m=Vocab.meta[s.set]||{},ws=Vocab.filter(s),L=Vocab.LEVELS,cats=m.categories||[],st=this.st(ws),isT=s.set==='toeic',pr=Progress.d.settings.perRound;
 const chip=(on,fn,t)=>`<button class="chip ${on?'p':''}" ${fn}>${t}</button>`;
 const chips=isT?chip(!s.cat,`onclick="App.sel.cat='';App.render()"`,'ทุกหมวด')+cats.map(c=>chip(s.cat===c,`data-c="${c}" onclick="App.sel.cat=this.dataset.c;App.render()"`,`${c} <small>${Vocab.filter({set:'toeic',cat:c}).length}</small>`)).join('')
 :chip(!s.level,`onclick="App.sel.level='';App.render()"`,'ทุกระดับ')+L.map(([k,n])=>chip(s.level===k,`onclick="App.sel.level='${k}';App.render()"`,`${k} <small>${Vocab.filter({set:s.set,level:k}).length}</small>`)).join('');
 const tip=isT&&s.cat?`<p class="th">${(m.sub||{})[s.cat]||''} — Tip: ${(m.tips||{})[s.cat]||'-'}</p>`:'';
 return`<div class="lib"><h2>เลือกชุดคำศัพท์</h2>
 <div class="seg"><button class="${!isT?'p':''}" onclick="App.sel={set:'oxford',level:'',cat:''};App.render()">📘 Oxford 3000</button><button class="${isT?'p':''}" onclick="App.sel={set:'toeic',level:'',cat:''};App.render()">💼 TOEIC</button></div>
 <h3>${isT?'เลือกหมวด':'เลือกระดับ'}</h3><div class="chips">${chips}</div>${tip}
 <div class="card sum"><b>${ws.length} คำ</b> ในชุดนี้<div class="th">เรียนแล้ว ${st.seen} · จำได้ ${st.known} · ต้องทบทวน ${st.review} · ยังไม่เรียน ${st.unseen}</div></div>
 <details class="card"><summary>ที่มาของข้อมูล</summary><p class="th">${m.source||'-'}</p><p class="th">${m.status||''}</p></details></div>
 <div class="startbar"><label>ต่อรอบ <select id="n" onchange="Progress.d.settings.perRound=+this.value;Progress.save()">${[10,20,30,50,0].map(n=>`<option value="${n}" ${n==pr?'selected':''}>${n||'ทั้งหมด'}</option>`).join('')}</select></label>
 <button class="p big" ${ws.length?'':'disabled'} onclick="App.start(Vocab.filter(App.sel),+document.getElementById('n').value)">▶ เริ่มเรียน</button></div>`},
v_flashcard(){return Flash.html()},
v_review(){const d=Review.dueWords();return`<div class="home"><h2>Review Words</h2><div class="card"><div style="font-size:48px;font-weight:700">${d.length}</div>${d.length?'คำที่ถึงเวลาทบทวน<button class="p big" style="margin-top:14px" onclick="App.start(Review.dueWords())">▶ เริ่มทบทวน</button>':'ยังไม่มีคำที่ถึงกำหนด 🎉<p class="th">กด "ทบทวน" ตอนเรียน คำจะมาอยู่ที่นี่</p><button class="p big" onclick="App.go(\'library\')">ไปเลือกคำศัพท์</button>'}</div></div>`},
v_progress(){const days=Object.entries(Progress.d.daily).slice(-7),mx=Math.max(1,...days.map(d=>d[1]));
 const bar=(l,q)=>`<div class="pb">${l}: ${q.known}/${q.total}<div class="bar"><i style="width:${q.total?q.known/q.total*100:0}%"></i></div></div>`;
 const by=Vocab.LEVELS.map(([k])=>bar(k,this.st(Vocab.filter({set:'oxford',level:k})))).join('');
 const bc=((Vocab.meta.toeic||{}).categories||[]).map(c=>bar(c,this.st(Vocab.filter({set:'toeic',cat:c})))).join('');
 const a=this.st(Vocab.all),pc=a.total?Math.round(a.known/a.total*100):0;
 return`<div class="lib"><h2>My Progress</h2><div class="card" style="text-align:center"><div class="ring" style="--p:${pc}"><span>${pc}%</span></div>จำได้ ${a.known} จาก ${a.total} คำ</div>${this.stats(Vocab.all)}
 <details class="card" open><summary>คำที่เรียนต่อวัน (7 วันล่าสุด)</summary><div class="row" style="align-items:end">${days.map(([d,n])=>`<div style="text-align:center;font-size:11px"><div style="background:var(--blue);width:30px;height:${n/mx*80}px;border-radius:6px"></div>${n}<br>${d.slice(5)}</div>`).join('')||'ยังไม่มีข้อมูล'}</div></details>
 <details class="card"><summary>Oxford ตามระดับ CEFR</summary>${by}</details><details class="card"><summary>TOEIC ตามหมวด</summary>${bc}</details></div>`},
v_search(){const f=this.sf,pos=[...new Set(Vocab.all.map(w=>w.pos).filter(x=>x&&x!=='-'))],cat=[...new Set(Vocab.all.map(w=>w.category).filter(Boolean))];
 const opt=(a,v,l)=>`<option value="">${l}</option>`+a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');
 return`<div class="lib"><div class="searchbar"><input id="q" value="${f.q}" placeholder="🔍 ค้นหาคำ / ความหมาย / หมวด" oninput="App.sf.q=this.value;App.sr()"></div>
 <div class="row fl"><select onchange="App.sf.set=this.value;App.render()"><option value="">ทุกคลัง</option><option value="oxford" ${f.set=='oxford'?'selected':''}>Oxford</option><option value="toeic" ${f.set=='toeic'?'selected':''}>TOEIC</option></select>
 <select onchange="App.sf.level=this.value;App.render()">${opt(Vocab.LEVELS.map(l=>l[0]),f.level,'ทุกระดับ')}</select><select onchange="App.sf.pos=this.value;App.render()">${opt(pos,f.pos,'ทุกชนิดคำ')}</select><select onchange="App.sf.cat=this.value;App.render()">${opt(cat,f.cat,'ทุกหมวด')}</select></div>
 <div class="card" id="res">${this.rows(Vocab.filter(f))}</div></div>`},
rows(r){const n=r.length;return`<p class="th">พบ ${n} คำ${n>40?' (แสดง 40 คำแรก พิมพ์เพิ่มเพื่อกรอง)':''}</p>`+r.slice(0,40).map(w=>`<div class="item" onclick="App.startOne('${w.id}')"><span><b>${w.word}</b> ${w.pos&&w.pos!=='-'?w.pos+' · ':''}${w.th}</span><span class="tag">${w.level||'TOEIC'}</span></div>`).join('')},
sr(){document.getElementById('res').innerHTML=this.rows(Vocab.filter(this.sf))},
v_settings(){const s=Progress.d.settings;return`<div class="lib"><h2>Settings</h2><div class="card"><div class="row">สำเนียงเสียงอ่าน <select onchange="Progress.d.settings.accent=this.value;Progress.save()"><option value="US" ${s.accent=='US'?'selected':''}>American</option><option value="UK" ${s.accent=='UK'?'selected':''}>British</option></select></div>
 <div class="row">เป้าหมายต่อวัน <select onchange="Progress.d.settings.goal=+this.value;Progress.save()">${[10,20,30].map(n=>`<option ${n==s.goal?'selected':''}>${n}</option>`).join('')}</select> คำ</div></div>
 <details class="card"><summary>นำเข้าคำศัพท์ (JSON)</summary><p class="th">รูปแบบเดียวกับ data/*.json ต้องเป็นข้อมูลที่คุณมีสิทธิ์ใช้งาน</p><input type="file" accept=".json" onchange="App.imp(this.files[0])"></details>
 <div class="card"><button onclick="if(confirm('ลบความก้าวหน้าทั้งหมด?')){Progress.reset();App.render()}">รีเซ็ตความก้าวหน้า</button></div></div>`},
async imp(f){if(!f)return;try{alert('นำเข้าแล้ว '+Vocab.import(await f.text())+' คำ')}catch(e){alert('ไฟล์ JSON ไม่ถูกต้อง')}}};
App.init();
</script></body></html>
